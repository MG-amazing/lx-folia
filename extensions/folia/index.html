<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; frame-src 'self'; img-src data:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LX · Folia 动效歌词</title><link rel="stylesheet" href="shell.css"></head><body>
<iframe id="stage" src="stage.html" title="Folia 歌词舞台"></iframe>
<header id="titlebar"><div class="identity"><span class="wordmark">LX <span> / </span> LYRICS</span><strong id="title">动效歌词</strong><span id="timing"></span></div><nav class="window-controls" aria-label="窗口控制"><button data-action="minimize" aria-label="最小化" title="最小化">−</button><button data-action="maximize" aria-label="最大化或还原" title="最大化 / 还原">□</button><button data-action="close" aria-label="关闭歌词窗口" title="关闭歌词窗口">×</button></nav></header>
<div id="dock" role="toolbar" aria-label="歌词播放控制"><div class="transport"><button data-action="prev" aria-label="上一首" title="上一首">⏮</button><button id="play" data-action="toggle_play" aria-label="播放" title="播放 / 暂停">▶</button><button data-action="next" aria-label="下一首" title="下一首">⏭</button></div><span class="divider"></span>
<label class="mode-label"><span class="control-caption">视觉效果</span><select id="mode" aria-label="歌词效果"><option value="sonnet">Sonnet · 流光</option><option value="classic">Luminous · 经典</option><option value="tilt">Tilt · 倾斜</option><option value="cadenza">Cadenza · 心象</option><option value="particles">Lumière · 光之轨迹</option><option value="claddagh">Claddagh · 3D 环形</option><option value="pendolo">Pendolo · 时计</option><option value="cappella">Cappella · 聊天</option><option value="diorama">Diorama · 3D 影院</option></select></label><span class="divider optional"></span>
<label class="font-control" title="歌词大小"><span>Aa</span><input id="size" type="range" min="0.6" max="1.8" step="0.1" value="1" aria-label="歌词大小"></label><label class="pin-control" title="窗口置顶"><input id="pin" type="checkbox"><span>置顶</span></label><button class="fullscreen" data-action="fullscreen" aria-label="切换全屏" title="全屏 F11 / Esc 退出">⛶</button></div>
<div id="seekbar"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="播放进度"><span id="duration">0:00</span></div>
<button id="effects-open" class="effect-launch" aria-label="切换歌词效果" title="歌词效果与背景">✧</button>
<aside id="effect-panel" hidden><div class="panel-heading"><div><small>LYRICS STUDIO</small><h2>歌词与光影</h2></div><button id="effects-close" aria-label="关闭效果面板">×</button></div><p class="panel-intro">Folia 全部 14 种歌词效果 · 点击即切换</p><div id="effect-grid"></div><h3>背景效果</h3><select id="background" aria-label="背景效果"></select><label class="url-label" hidden>网页地址<input id="background-url" type="url" placeholder="https://…" aria-label="自定义网页背景地址"></label><div class="preference-grid"><label>配色<select id="palette" aria-label="歌词配色"><option value="cover">封面取色</option><option value="violet">暮紫</option><option value="ocean">深海</option><option value="amber">暖金</option><option value="graphite">石墨</option></select></label><label>字体<select id="font" aria-label="歌词字体"><option value="sans">现代黑体</option><option value="serif">衬线</option><option value="mono">等宽</option></select></label></div><label class="range-row">背景模糊<input id="blur" type="range" min="0" max="70" step="1" aria-label="背景模糊"></label><label class="range-row">背景暗度<input id="dim" type="range" min="0.1" max="0.95" step="0.05" aria-label="背景暗度"></label><div class="check-row"><label><input id="translation" type="checkbox" checked>显示翻译</label><label><input id="motion" type="checkbox">减少动画</label></div><h3>歌词时间轴 <small>点击歌词跳转</small></h3><div id="lyric-timeline"></div></aside>
<footer><span class="live-dot"></span><span id="status">在 LX 中播放歌曲，歌词会自动同步</span><span class="footer-hint">空格 暂停 · ← → 快进 · F11 全屏</span></footer><script src="ui-i18n.js"></script><script src="folia-colors.js"></script><script src="folia-catalog.js"></script><script src="desktop-shell.js"></script></body></html>
